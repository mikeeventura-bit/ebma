<!-- ==========================================================================
     CAMPAIGN STATEMENT  (brief §03, §04)
     A poster-scale statement in its own section. Use sparingly — two or three
     per page at most. Their power comes from being rare.

     SAFE TO EDIT: the text in each span, and the section ground class.
     Grounds: (none) = ink | ebma-statement--cream | ebma-statement--radish

     Put ONE line in .ebma-campaign__accent to colour it. The accent tint is
     chosen automatically for the ground it sits on, so it always meets
     contrast — do not hard-code a colour here.

     UPPERCASE: add .ebma-campaign--poster for a true all-caps poster
     statement, and use it AT MOST ONCE PER PAGE. Rarity is what gives it
     force; applied to three sections it becomes the page's default voice.
     ========================================================================== -->

<div class="ebma-statement ebma-statement--cream">
  <div class="ebma-wrap">
    <div class="ebma-statement__inner">
      <h2 class="ebma-campaign">
        <span class="ebma-campaign__line">We are not simply</span>
        <span class="ebma-campaign__line">responding to</span>
        <span class="ebma-campaign__line">food insecurity.</span>
      </h2>
    </div>
    <p class="ebma-lead">We are helping build an alternative food system for our community &mdash; one that gives East Brooklyn greater and more consistent access to fresh, locally sourced food while creating economic opportunity throughout that system.</p>
  </div>
</div>
