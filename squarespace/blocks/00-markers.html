<!-- ==========================================================================
     MARKER SNIPPETS
     Add ONE Code Block to a native Squarespace section containing just the
     marker for that section. The Custom CSS then styles the whole section
     around it, while the CONTENT stays editable in the normal editor.

     Copy only the single line you need.
     ========================================================================== -->

<!-- Section grounds -->
<div class="ebma-mark ebma-mark--ink"></div>
<div class="ebma-mark ebma-mark--cream"></div>
<div class="ebma-mark ebma-mark--deep"></div>

<!-- Section behaviours -->
<div class="ebma-mark ebma-mark--hero"></div>       <!-- adds the top + bottom scrims -->
<div class="ebma-mark ebma-mark--campaign"></div>   <!-- H1/H2 become campaign type -->
<div class="ebma-mark ebma-mark--stats"></div>      <!-- H2 = number, P = label -->
<div class="ebma-mark ebma-mark--footer"></div>

<!-- Combine freely on one section: -->
<div class="ebma-mark ebma-mark--ink ebma-mark--stats"></div>
