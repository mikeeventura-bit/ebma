<!-- ==========================================================================
     HERO  (brief §06)
     Squarespace cannot express this type treatment natively, so it is a full
     Code Block.

     HOW TO BUILD IT
     1. Add a blank section. Set its background to the hero photograph
        (Section settings -> Background -> Image).
     2. Add a Code Block containing:  <div class="ebma-mark ebma-mark--hero"></div>
     3. Add a second Code Block containing everything below.
     4. Set the section height to Large / Full.

     SAFE TO EDIT: the text between the tags, and the two link hrefs.
     Each line is its own <span>, and that is what controls where the headline
     breaks. Add or remove spans to re-break it; never let it wrap on its own.

     SENTENCE CASE, one accent word. Uppercase belongs on the eyebrow label
     and nowhere else; all-caps headlines are what made the first pass shout.
     ========================================================================== -->

<div class="ebma-hero-copy">
  <h1 class="ebma-campaign">
    <span class="ebma-campaign__line">Food. Community.</span>
    <span class="ebma-campaign__line ebma-campaign__accent">Opportunity.</span>
  </h1>

  <p class="ebma-hero__sub">Building a stronger food system in East Brooklyn.</p>

  <div class="ebma-hero__actions">
    <a class="ebma-btn ebma-btn--solid-cream" href="/our-work">Explore Our Work</a>
    <a class="ebma-btn ebma-btn--invert" href="/donate">Support EBMA</a>
  </div>
</div>
